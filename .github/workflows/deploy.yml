# Builds the site and publishes it to GitHub Pages every time you push to master.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
      - name: Install, build and upload the site
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      # Tell Bing (and other IndexNow search engines) the pages changed. Never fails the deploy.
      - name: Ping IndexNow
        run: |
          sleep 30
          curl -s -o /dev/null -w "IndexNow: %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"www.toffeenutdesign.com","key":"a441aa888cde97cfd947dc61c1681f94","keyLocation":"https://www.toffeenutdesign.com/a441aa888cde97cfd947dc61c1681f94.txt","urlList":["https://www.toffeenutdesign.com/","https://www.toffeenutdesign.com/about/","https://www.toffeenutdesign.com/llms.txt"]}' || true
